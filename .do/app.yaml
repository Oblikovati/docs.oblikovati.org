# DigitalOcean App Platform spec for the Oblikovati documentation site.
#
# This replaces the sample-html placeholder: a Node static-site build of the Docusaurus
# project in this repo (github.com/Oblikovati/docs.oblikovati.org), served from build/.
#
# Bootstrap once (captures the app id for the GitHub Actions deploy):
#   doctl apps create --spec .do/app.yaml
#   doctl apps list           # copy the app's id into the DO_APP_ID repo secret
#
# Thereafter .github/workflows/deploy.yml keeps the app in sync on every push to main.
name: docs-oblikovati-org
region: ams

alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED

features:
- buildpack-stack=ubuntu-22

ingress:
  rules:
  - component:
      name: docs
    match:
      path:
        prefix: /

static_sites:
- name: docs
  environment_slug: node-js
  git:
    repo_clone_url: https://github.com/Oblikovati/docs.oblikovati.org.git
    branch: main
  # Node version comes from .nvmrc (20). Docusaurus emits the site into build/.
  build_command: npm run build
  output_dir: build
  index_document: index.html
  error_document: 404.html

# Custom domain. Requires a DNS CNAME for docs.oblikovati.org -> the app's
# ondigitalocean.app hostname; until that resolves the DOMAIN_FAILED alert will fire.
# Remove this block to deploy on the default *.ondigitalocean.app URL first.
domains:
- domain: docs.oblikovati.org
  type: PRIMARY
