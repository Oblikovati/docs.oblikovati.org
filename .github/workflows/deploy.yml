name: Deploy

# On every push to main: build the site (fails fast if broken), then trigger a DigitalOcean
# App Platform deployment of the latest commit. `create-deployment` fetches the newest commit
# on the app's branch; `--force-rebuild` skips the build cache so nothing stale is served.
#
# NOTE: this does NOT re-apply .do/app.yaml. `create-deployment` uses the app's stored spec.
# After changing .do/app.yaml, apply it once: `doctl apps update <DO_APP_ID> --spec .do/app.yaml`.
# (We avoid `apps update --spec` here because, when the spec is unchanged, it redeploys the
# PREVIOUS commit instead of the latest.)
#
# Required repository secrets:
#   DIGITALOCEAN_ACCESS_TOKEN  — a DO API token with app write access
#   DO_APP_ID                  — the id of the App Platform app (see README bootstrap notes)
on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (validation before deploy)
        run: npm run build
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Deploy latest commit
        run: doctl apps create-deployment "${{ secrets.DO_APP_ID }}" --force-rebuild --wait
