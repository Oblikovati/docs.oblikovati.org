name: Deploy to Hetzner

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/oblikovati/docs.oblikovati.org

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: docs-org-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Open K3s API tunnel
        env:
          KUBE_TUNNEL_SSH_KEY: ${{ secrets.KUBE_TUNNEL_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KUBE_TUNNEL_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '[100.89.0.119]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO2uONzdbVdL8rkEb1XNxil1OWuFZYJheESxuwEOfItw' > ~/.ssh/known_hosts
          ssh -fN -p 2222 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes -o ConnectTimeout=20 -L 16443:127.0.0.1:6443 tunnel@100.89.0.119
      - name: Deploy immutable image
        env:
          KUBECONFIG_HETZNER: ${{ secrets.KUBECONFIG_HETZNER }}
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.sha }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          printf '%s' "$KUBECONFIG_HETZNER" > kubeconfig
          export KUBECONFIG="$PWD/kubeconfig"
          kubectl create secret docker-registry ghcr-pull --namespace oblikovati \
            --docker-server=ghcr.io --docker-username=viniciusmiguel \
            --docker-password="$GHCR_PULL_TOKEN" --dry-run=client -o yaml | kubectl apply -f -
          sed "s|${IMAGE}:placeholder|${IMAGE_REF}|" deploy/kubernetes/production.yaml | kubectl apply -f -
